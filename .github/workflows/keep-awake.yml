name: keep-awake

# Pings the hosted site so Render's free instance doesn't go to sleep after 15 idle minutes.
# (Free for public repos. GitHub may delay scheduled runs by a few minutes, which is fine here.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -sS --max-time 120 --retry 2 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://build-lab.onrender.com/api/config
