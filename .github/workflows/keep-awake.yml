name: keep-awake

# Backup ping for the hosted site. The real keep-alive is Grafana Cloud scraping /metrics every minute
# (docs/OBSERVABILITY.md): GitHub throttles frequent schedules on free repos, so this cron actually
# fires every few hours, which only helps if the Grafana scrape is ever turned off.
# (Free for public repos.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -sS --max-time 120 --retry 2 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://build-lab.onrender.com/api/config
