<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322c55e'/%3E%3Cpath d='M9 22l5-12 4 8 2-4 3 8' stroke='%230b1220' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 22l5-12 4 8 2-4 3 8" stroke="var(--accent-ink)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    Build Lab
  </a>
  <nav class="crumbs" id="crumbs"></nav>
  <label class="lang-picker" title="Language you solve projects in">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <select id="langSel" aria-label="Programming language"><option value="java">Java</option></select>
  </label>
  <div class="progress-pill" id="progressPill" title="Projects solved">0 / 0 solved</div>
</header>

<main id="app"></main>

<template id="tpl-list">
  <section class="hero">
    <div class="hero-text">
      <p class="eyebrow">Backend practice projects · Java · Python · Go · C++</p>
      <h1>Build it. Break it. Fix it.</h1>
      <p class="lead">Eighteen realistic backend tasks in Java, Python, Go or C++: concurrency, API design, persistence and
        debugging production code. Edit in the browser or your IDE, then run the test suite.</p>
      <div class="hero-actions">
        <a class="btn primary" id="startBtn" href="#/">Start next project</a>
        <span class="muted" id="heroStats"></span>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <pre><code><span class="k">public</span> <span class="k">boolean</span> <span class="f">tryAcquire</span>(String id) {
  Bucket b = buckets.<span class="f">computeIfAbsent</span>(id, ...);
  <span class="k">synchronized</span> (b) {
    b.<span class="f">refill</span>(clock.<span class="f">nowMillis</span>());
    <span class="k">return</span> b.<span class="f">take</span>();
  }
}
<span class="c">// PASS  12 / 12  in 0.4s</span></code></pre>
    </div>
  </section>

  <section class="filters" aria-label="Filters">
    <input type="search" id="q" placeholder="Search projects" aria-label="Search">
    <select id="fDifficulty" aria-label="Difficulty">
      <option value="">Difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option>
    </select>
    <select id="fStatus" aria-label="Status">
      <option value="">Status</option><option value="todo">To do</option><option value="attempted">Attempted</option><option value="solved">Solved</option>
    </select>
    <select id="fKind" aria-label="Type">
      <option value="">Type</option><option value="build">Build</option><option value="debug">Debug</option>
    </select>
    <select id="fTopic" aria-label="Topic"><option value="">Topics</option></select>
    <button class="btn ghost icon" id="sortBtn" title="Sort by difficulty" aria-label="Sort">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </section>

  <section class="grid" id="grid"></section>
  <p class="empty muted" id="empty" hidden>No projects match these filters.</p>
</template>

<template id="tpl-detail">
  <section class="workspace">
    <div class="pane left">
      <div class="pane-head">
        <div class="tabs" role="tablist" id="leftTabs">
          <button role="tab" data-tab="spec" class="active">Spec</button>
          <button role="tab" data-tab="tests">Tests</button>
          <button role="tab" data-tab="solution">Solution</button>
        </div>
      </div>
      <div class="pane-body" id="leftBody"></div>
    </div>

    <div class="splitter" id="splitter" title="Drag to resize"></div>

    <div class="pane right">
      <div class="pane-head">
        <div class="tabs files" id="fileTabs"></div>
        <div class="toolbar">
          <select id="statusSel" aria-label="Status">
            <option value="todo">To do</option><option value="attempted">Attempted</option><option value="solved">Solved</option>
          </select>
          <button class="btn ghost" id="resetBtn" title="Restore the starter code">Reset</button>
          <button class="btn ghost" id="saveBtn" title="Ctrl+S">Save</button>
          <button class="btn primary" id="runBtn" title="Ctrl+Enter">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>
            Run tests
          </button>
        </div>
      </div>
      <div class="editor-wrap"><textarea id="editor"></textarea></div>
      <div class="results" id="results">
        <div class="results-head">
          <input type="checkbox" id="selectAll" title="Select all tests" aria-label="Select all tests">
          <strong>Tests</strong>
          <span class="muted" id="resultSummary"></span>
          <span class="spacer"></span>
          <button class="btn ghost sm" id="runFailedBtn" title="Ctrl+Shift+Enter" disabled>Run failed</button>
          <button class="btn ghost sm" id="runSelectedBtn" disabled>Run selected</button>
        </div>
        <div class="results-body" id="resultsBody"></div>
        <div class="results-foot muted small" id="pathHint"></div>
      </div>
    </div>
  </section>
</template>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="codeintel.js"></script>
<script src="app.js"></script>
</body>
</html>
