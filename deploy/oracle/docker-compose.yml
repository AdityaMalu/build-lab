# Build Lab on one VM (Oracle Always Free Ampere A1, or any Ubuntu box with Docker):
#
#   browser -> caddy (HTTPS) -> api -> redis <- worker (systemd on the host) -> one gVisor container per run
#
# The worker is not in this file: it starts containers, so it runs on the host (buildlab-worker.service)
# instead of getting the Docker socket inside a container. Started by setup.sh with --env-file .env.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"   # for the worker on the host; never published to the internet
    restart: unless-stopped

  api:
    image: build-lab
    environment:
      LAB_ROLE: api
      LAB_REDIS_URL: "redis://:${REDIS_PASSWORD:?}@redis:6379"
      LAB_METRICS_TOKEN: "${LAB_METRICS_TOKEN:-}"
      LAB_LOKI_URL: "${LAB_LOKI_URL:-}"
      LAB_LOKI_USER: "${LAB_LOKI_USER:-}"
      LAB_LOKI_TOKEN: "${LAB_LOKI_TOKEN:-}"
    depends_on: [redis]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAB_DOMAIN: "${LAB_DOMAIN:?}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # Let's Encrypt certificates
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy_data: {}
